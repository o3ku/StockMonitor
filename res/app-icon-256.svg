<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 深蓝色背景圆角矩形 -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="#2c3e50" stroke="#1a252f" stroke-width="4"/>
  
  <!-- 股票图表线条 -->
  <g stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 上升趋势线 -->
    <polyline points="48,180 80,152 112,168 144,128 176,112 208,88"/>

    <!-- 数据点 -->
    <circle cx="48" cy="180" r="6" fill="#e74c3c"/>
    <circle cx="80" cy="152" r="6" fill="#e74c3c"/>
    <circle cx="112" cy="168" r="6" fill="#e74c3c"/>
    <circle cx="144" cy="128" r="6" fill="#c0392b"/>
    <circle cx="176" cy="112" r="6" fill="#c0392b"/>
    <circle cx="208" cy="88" r="6" fill="#c0392b"/>
  </g>
  
  <!-- 简化的坐标轴 -->
  <g stroke="#7f8c8d" stroke-width="3" opacity="0.6">
    <line x1="40" y1="200" x2="216" y2="200"/>
    <line x1="40" y1="200" x2="40" y2="72"/>
  </g>
  
  <!-- 网格线 -->
  <g stroke="#7f8c8d" stroke-width="1" opacity="0.3">
    <line x1="40" y1="160" x2="216" y2="160"/>
    <line x1="40" y1="120" x2="216" y2="120"/>
    <line x1="80" y1="72" x2="80" y2="200"/>
    <line x1="120" y1="72" x2="120" y2="200"/>
    <line x1="160" y1="72" x2="160" y2="200"/>
  </g>
</svg>
