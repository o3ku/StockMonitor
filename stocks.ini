# 股票监控系统统一配置文件
# 此文件位于程序运行目录，包含所有配置项

[api]
# 股票数据源配置
# 可选值: sina, tencent, netease, easymoney, xueqiu
# sina - 新浪财经 (默认)
# tencent - 腾讯财经
# netease - 网易财经
# easymoney - 东方财富
# xueqiu - 雪球
source=sina

[StockList]
# 股票代码列表，用逗号分隔
StockCodes=

[UI]
# 主题设置 (light/dark)
Theme=light

# 窗口透明度 (0.3-1.0)
WindowOpacity=1.0

# 刷新间隔 (毫秒，最小1000)
RefreshInterval=5000

[Hotkey]
# 全局快捷键
Key=Ctrl+Alt+S
